{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2>Threshold Settings</h2>
    <form method="post" action="/threshold">
        <div class="form-group">
            <label for="sensor">Sensor Name</label>
            <input type="text" class="form-control" id="sensor" name="sensor" required>
        </div>
        <div class="form-group">
            <label for="min_value">Minimum Value</label>
            <input type="number" step="any" class="form-control" id="min_value" name="min_value" required>
        </div>
        <div class="form-group">
            <label for="max_value">Maximum Value</label>
            <input type="number" step="any" class="form-control" id="max_value" name="max_value" required>
        </div>
        <button type="submit" class="btn btn-primary">Save Threshold</button>
    </form>
</div>
{% endblock %}
