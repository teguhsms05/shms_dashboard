<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – Structural Health Monitoring System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>
    <!--
    ============================================================================
    LOGIN PAGE CONTENT
    ============================================================================
    This section contains the main layout for the login page,
    including decorative background elements and the authentication form.
    ============================================================================
    -->
    <!-- ══ Login Card ══ -->
    <div class="login-card">

        <!-- Brand -->
        <div class="brand">
            <div class="brand-icon">
                <img src="{{ url_for('static', filename='assets/dsi.webp') }}" alt="Logo">
            </div>
        </div>

        <!-- Heading -->
        <div class="login-heading">
            <h1>Login to account</h1>
            <p>Structural Health Monitoring (SHM) Bridge <br></p>
        </div>

        <div class="divider"></div>

        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="flash {{ category }}">
            <i class="fas fa-{{ 'circle-check' if category == 'success' else 'triangle-exclamation' }}"
                style="margin-right:6px;"></i>{{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <!-- Form -->
        <form method="POST" action="/login" id="loginForm">
            <div class="form-group">
                <div class="input-wrap">
                    <i class="fas fa-user"></i>
                    <input id="username" name="username" type="text" class="login-input" placeholder="Username"
                        autocomplete="username" required />
                </div>
            </div>

            <div class="form-group">
                <div class="input-wrap">
                    <i class="fas fa-lock"></i>
                    <input id="password" name="password" type="password" class="login-input" placeholder="Password"
                        autocomplete="current-password" required />
                    <button type="button" class="toggle-pw" onclick="togglePw()" title="Show/Hide password">
                        <i class="fas fa-eye" id="pwIcon"></i>
                    </button>
                </div>
            </div>

            <div class="remember-row">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Remember me</label>
            </div>

            <div class="actions-row">
                <button type="submit" class="btn-login" id="submitBtn">
                    <i class="fas fa-right-to-bracket"></i> Login
                </button>
                <!-- <a href="#" class="forgot-link">Forget password?</a> -->
            </div>
        </form>

        <!-- Footer -->
        <div class="card-footer">
            <p>SHMS &copy; {{ current_year }}</p>
            <!-- <p>SHMS &copy; {{ current_year }} &nbsp;·&nbsp; Barelang Bridge, Batam</p> -->
        </div>
    </div>

    <script>
        function togglePw() {
            const pw = document.getElementById('password');
            const icon = document.getElementById('pwIcon');
            if (pw.type === 'password') {
                pw.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                pw.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function () {
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Logging in…';
        });
    </script>
</body>

</html>
