{% extends "base.html" %}

{% block content %}
<div class="page-container">
    <div class="page-header" style="margin-bottom: 20px;">
        <h2 class="page-title">Cross-Correlation Dashboard</h2>
        <p>Overlay up to 5 historical sensor data series on the same timeline to analyze correlations.</p>
    </div>

    <!-- Controls Card -->
    <div class="card" style="margin-bottom: 20px; padding: 20px; background: var(--bg-card); border-radius: 8px; border: 1px solid var(--border-color);">
        <div style="display: flex; gap: 20px; margin-bottom: 20px;">
            <div style="flex: 1;">
                <label style="display: block; font-size: 0.8rem; margin-bottom: 5px; font-weight: 600; color: var(--text-muted);">Start Date</label>
                <input type="text" id="input-start-date" class="form-control" placeholder="Select Start Date" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-body); color: var(--text-main);">
            </div>
            <div style="flex: 1;">
                <label style="display: block; font-size: 0.8rem; margin-bottom: 5px; font-weight: 600; color: var(--text-muted);">End Date</label>
                <input type="text" id="input-end-date" class="form-control" placeholder="Select End Date" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-body); color: var(--text-main);">
            </div>
        </div>

        <h4 style="margin-bottom: 10px; font-size: 1rem; color: var(--text-main);">Data Sources (Min 2, Max 5)</h4>
        
        <div id="sources-container" style="display: flex; flex-direction: column; gap: 15px;">
            <!-- Source items injected here via JS -->
        </div>

        <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: space-between;">
            <button id="btn-add-source" class="btn" style="background: var(--bg-body); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px;">
                <i class="fa-solid fa-plus"></i> Add Sensor Series
            </button>
            <button id="btn-generate-chart" class="btn" style="background: #3b82f6; color: white; border: none; padding: 8px 24px; border-radius: 6px; cursor: pointer; font-weight: 600;">
                <i class="fa-solid fa-chart-line" style="margin-right: 6px;"></i> Generate Chart
            </button>
        </div>
    </div>

    <!-- Chart Card -->
    <div class="card" style="background: var(--bg-card); border-radius: 8px; border: 1px solid var(--border-color); padding: 20px; position: relative;">
        <div id="loading-overlay" style="display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.5); z-index: 10; align-items: center; justify-content: center; border-radius: 8px; color: white; font-weight: bold; font-size: 1.2rem;">
            Loading Data...
        </div>
        <div id="correlation-chart" style="width: 100%; height: 500px;"></div>
        <!-- Legend Area (ATRH/ANM3D Style) -->
        <div id="correlation-legend" class="chart-legend" style="display: flex; justify-content: center; gap: 20px; margin-top: 15px; flex-wrap: wrap;"></div>
    </div>
</div>

<style>
    .chart-legend {
        border-top: 1px solid var(--border-color);
        padding-top: 15px;
    }
    .legend-item {
        color: var(--text-main);
        font-weight: 600;
        font-size: 0.85rem;
    }
    .legend-item.inactive {
        opacity: 0.3 !important;
        text-decoration: line-through;
    }
</style>

<!-- Inject Sensors mapping -->
<script>
    window.appSensors = {
        anm2d: {{ anm2d_sensors | tojson | safe }},
        anm3d: {{ anm3d_sensors | tojson | safe }},
        atrh: {{ atrh_sensors | tojson | safe }},
        temp: {{ temp_sensors | tojson | safe }},
        tiltmeter: {{ tiltmeter_sensors | tojson | safe }}
    };
</script>

<!-- Script logic -->
<script src="{{ url_for('static', filename='js/correlation.js') }}"></script>
{% endblock %}
